<title id="title">EMAIL — Start a conversation</title>
<defs>
<linearGradient id="edge"><stop stop-color="#72f5d0"/><stop offset=".52" stop-color="#b6a0ff"/><stop offset="1" stop-color="#ed9cc8"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#6553c1" stop-opacity=".38"/><stop offset="1" stop-color="#6553c1" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#141b2d"/><stop offset="1" stop-color="#0c1220"/></linearGradient>
