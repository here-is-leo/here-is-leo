<style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.orbit{animation:spin 45s linear infinite;transform-origin:900px 278px}.pulse{animation:breath 5s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breath{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}</style>
