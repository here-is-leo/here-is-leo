<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title">
<title id="title">Ilia Farahani — system boot sequence. Backend developer, security researcher.</title>
<defs>
<pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1.2" fill="#00ff9c" fill-opacity=".03"/></pattern>
</defs>
<style>
text{font-family:'JetBrains Mono','Consolas',monospace}
.dim{fill:#0d6b45}
.mid{fill:#17a869}
.hi{fill:#00ff9c}
.blink{animation:blink 1.1s steps(2) infinite}
.scan{animation:scanmove 6s linear infinite}
@keyframes blink{50%{opacity:0}}
@keyframes scanmove{0%{transform:translateY(0)}100%{transform:translateY(560px)}}
@media(prefers-reduced-motion:reduce){.blink,.scan{animation:none}}
</style>
<rect width="1200" height="560" fill="#020402"/>
<rect width="1200" height="560" fill="url(#scan)"/>
<rect x="0" y="0" width="1200" height="560" fill="none" stroke="#0d6b45" stroke-width="2"/>
<rect class="scan" x="0" y="-560" width="1200" height="2" fill="#00ff9c" fill-opacity=".25"/>

<text x="32" y="38" class="dim" font-size="13">root@here-is-leo:~#</text>
<text x="245" y="38" class="hi" font-size="13">boot --profile=engineer</text>

<text x="32" y="70" class="mid" font-size="13">[ OK ] loading identity ................ </text><text x="392" y="70" class="hi" font-size="13">ILIA_FARAHANI</text>
<text x="32" y="94" class="mid" font-size="13">[ OK ] mounting focus .................. </text><text x="392" y="94" class="hi" font-size="13">backend / appsec / linux</text>
<text x="32" y="118" class="mid" font-size="13">[ OK ] loading philosophy .............. </text><text x="392" y="118" class="hi" font-size="13">understand before you build</text>
<text x="32" y="142" class="mid" font-size="13">[ OK ] checking assumptions ............ </text><text x="392" y="142" class="hi" font-size="13">none trusted by default</text>
<text x="32" y="166" class="mid" font-size="13">[ .. ] status ........................... </text><text class="mid blink" font-size="13"><tspan x="392" y="166">online</tspan></text>

<text x="32" y="230" class="hi" font-size="64" font-weight="700" letter-spacing="1">ILIA FARAHANI</text>
<text x="34" y="266" class="mid" font-size="19">$ whoami</text>
<text x="34" y="292" class="dim" font-size="16">backend developer — security-focused mindset</text>

<g font-size="14" class="dim">
<text x="34" y="336">&gt; The API that stays predictable.</text>
<text x="34" y="360">&gt; The auth flow that holds up under pressure.</text>
<text x="34" y="384">&gt; The deploy you can repeat at 3am, half asleep.</text>
</g>

<rect x="32" y="410" width="1136" height="1" fill="#0d6b45"/>

<g font-size="12" class="mid">
<text x="34" y="440">[01] BUILD</text><text x="34" y="460" class="dim" font-size="12">reliable systems, boring on purpose</text>
<text x="304" y="440">[02] DEFEND</text><text x="304" y="460" class="dim" font-size="12">think in attack paths, not checklists</text>
<text x="574" y="440">[03] AUTOMATE</text><text x="574" y="460" class="dim" font-size="12">repeat the deploy, not the mistake</text>
<text x="844" y="440">[04] REFINE</text><text x="844" y="460" class="dim" font-size="12">ship it, break it, learn, rebuild</text>
</g>

<rect x="32" y="484" width="1136" height="1" fill="#0d6b45"/>
<text x="34" y="514" class="dim" font-size="12">root@here-is-leo:~#</text>
<text class="hi blink" font-size="12"><tspan x="220" y="514">_</tspan></text>
<text x="1166" y="514" text-anchor="end" class="dim" font-size="12">STAY CURIOUS.</text>
</svg>
